apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-02-web
  namespace: csharp-ten-apps
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-02-web
  template:
    metadata:
      labels:
        app: app-02-web
    spec:
      containers:
        - name: web
          image: ghcr.io/example/app-02-web:latest
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /
              port: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
