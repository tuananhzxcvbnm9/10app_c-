apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-03-api
  namespace: csharp-ten-apps
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-03-api
  template:
    metadata:
      labels:
        app: app-03-api
    spec:
      containers:
        - name: api
          image: ghcr.io/example/app-03-api:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: app-03-config
            - secretRef:
                name: app-03-secret
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
